apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-postgres
spec:
  replicas: 1

  selector:
    matchLabels:
      app: orderflow-postgres

  template:
    metadata:
      labels:
        app: orderflow-postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: orderflow-postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: orderflow-postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
                - -d
                - orderflow
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
                - -d
                - orderflow
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: postgres-data 
          persistentVolumeClaim:
            claimName: orderflow-postgres-pvc