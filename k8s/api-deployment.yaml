apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-api
spec:
  replicas: 3

  selector:
    matchLabels:
      app: orderflow-api

  template:
    metadata:
      labels:
        app: orderflow-api

    spec:
      containers:
        - name: orderflow-api
          image: orderflow:1.3

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              value: jdbc:postgresql://orderflow-postgres:5432/orderflow

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orderflow-postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                   name: orderflow-postgres-secret
                   key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5