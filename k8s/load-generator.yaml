apiVersion: v1
kind: Pod
metadata:
  name: orderflow-load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O- http://orderflow-api:8080/api/products > /dev/null
          done