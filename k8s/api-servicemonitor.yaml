apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: orderflow-api
  namespace: monitoring
  labels:
    release: kube-prometheus-stack

spec:
  selector:
    matchLabels:
      app: orderflow-api

  namespaceSelector:
    matchNames:
      - default

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s