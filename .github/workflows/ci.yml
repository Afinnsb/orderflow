name: OrderFlow CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: orderflow
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: orderflow123

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/orderflow
          DB_USERNAME: orderflow
          DB_PASSWORD: orderflow123
        run: mvn clean test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Update Kubernetes deployment
        shell: powershell
        env:
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          $shaImage = ($env:IMAGE -split "`n")[0]

          Write-Host "Deploying image: $shaImage"

          kubectl set image deployment/orderflow-api `
            orderflow-api=$shaImage `
            -n default

      - name: Wait for rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/orderflow-api `
            --timeout=180s `
            -n default

      - name: Verify deployment
        shell: powershell
        run: |
          kubectl get deployment orderflow-api -n default
          kubectl get pods -l app=orderflow-api -n default